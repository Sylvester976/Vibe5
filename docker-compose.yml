services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotify_insights
      POSTGRES_PASSWORD: spotify_insights
      POSTGRES_DB: spotify_insights
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotify_insights"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["/app/api", "-migrate"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://spotify_insights:spotify_insights@postgres:5432/spotify_insights?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["/app/worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://spotify_insights:spotify_insights@postgres:5432/spotify_insights?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
